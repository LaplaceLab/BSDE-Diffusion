[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsde-diffusion"
version = "0.2.0"
description = "Terminal-conditioned diffusion framework for general inverse problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.urls]
Homepage = "https://laplacelab.github.io/BSDEDiffusion/"
Source = "https://github.com/LaplaceLab/BSDE-Diffusion"
Paper = "https://laplacelab.github.io/BSDEDiffusion/paper.pdf"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["bsde_diffusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
